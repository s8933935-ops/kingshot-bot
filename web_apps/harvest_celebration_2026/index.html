<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>『Kingshot（キングショット）』豊穣祝典／豊穣の主 完全攻略ガイド（2026年11月）</title>
<style>
  :root {
    --bg-deep: #0d0b09;
    --bg-surface: #171310;
    --bg-card: #1f1914;
    --bg-card-hover: #29211a;
    --border-subtle: rgba(216, 164, 70, 0.22);
    --border-strong: rgba(216, 164, 70, 0.55);
    --gold: #e4b659;
    --gold-bright: #f7d98c;
    --gold-dim: #9c742b;
    --amber: #df7a35;
    --crimson: #e05252;
    --emerald: #44b98d;
    --sky: #5aa9e6;
    --text-main: #f3ece2;
    --text-muted: #b9aa97;
    --text-dim: #8a7b69;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Segoe UI", Tahoma, Arial, -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 20% 0%, #261b10 0%, var(--bg-deep) 45%), var(--bg-deep);
    color: var(--text-main);
    line-height: 1.75;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  html[dir="rtl"] body {
    font-family: "Segoe UI", Tahoma, "Arabic Typesetting", Arial, sans-serif;
    line-height: 1.85;
  }
  .ltr-keep {
    direction: ltr;
    unicode-bidi: isolate;
  }
  a { color: var(--gold-bright); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Sticky Top Navigation */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13, 11, 9, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .nav-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 9px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px 14px;
    flex-wrap: wrap;
  }
  .brand {
    font-weight: 800;
    font-size: 14.5px;
    color: var(--gold-bright);
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-bright), var(--amber));
    box-shadow: 0 0 10px var(--gold);
    flex-shrink: 0;
  }
  .nav-links {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    align-items: center;
  }
  .nav-links a {
    font-size: 12.2px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: all 0.2s;
  }
  .nav-links a:hover {
    color: var(--gold-bright);
    background: rgba(228, 182, 89, 0.12);
    border-color: var(--border-subtle);
    text-decoration: none;
  }
  .lang-switcher {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    padding: 3px;
    direction: ltr;
    unicode-bidi: isolate;
  }
  .lang-btn {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.8px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.18s;
    line-height: 1.2;
    white-space: nowrap;
  }
  .lang-btn:hover {
    color: var(--gold-bright);
    background: rgba(228, 182, 89, 0.12);
  }
  .lang-btn.active {
    background: linear-gradient(135deg, var(--gold-bright), var(--amber));
    color: #161007;
    border-color: var(--gold-bright);
    box-shadow: 0 0 12px rgba(228, 182, 89, 0.3);
  }

  /* Main Container */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 18px 80px;
  }

  /* Hero with Rich Art Background */
  .hero {
    background:
      linear-gradient(125deg, rgba(16, 11, 7, 0.90) 0%, rgba(24, 16, 10, 0.78) 52%, rgba(16, 11, 7, 0.92) 100%),
      url("images/art/hero_harvest_festival.jpg") center center / cover no-repeat;
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 38px 32px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    margin-bottom: 40px;
  }
  .hero-top-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 24px;
    align-items: center;
    margin-bottom: 26px;
  }
  @media (max-width: 860px) {
    .hero-top-grid { grid-template-columns: 1fr; }
  }
  .hero-art-card {
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border-strong);
    box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6);
    cursor: pointer;
    position: relative;
    transition: transform 0.22s, box-shadow 0.22s;
  }
  .hero-art-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 36px rgba(228, 182, 89, 0.22);
  }
  .hero-art-card img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
  }
  .hero-art-cap {
    position: absolute;
    bottom: 0; inset-inline: 0;
    padding: 8px 12px;
    background: linear-gradient(180deg, transparent, rgba(10, 8, 6, 0.92));
    font-size: 12px;
    color: var(--gold-bright);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    gap: 8px;
  }
  .hero-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
    letter-spacing: 0.02em;
  }
  .pill-gold { background: rgba(228, 182, 89, 0.2); color: var(--gold-bright); border: 1px solid var(--border-strong); }
  .pill-green { background: rgba(68, 185, 141, 0.2); color: #7ee3bc; border: 1px solid rgba(68, 185, 141, 0.5); }
  .pill-amber { background: rgba(223, 122, 53, 0.22); color: #ffb985; border: 1px solid rgba(223, 122, 53, 0.5); }
  .pill-crimson { background: rgba(224, 82, 82, 0.22); color: #ffa3a3; border: 1px solid rgba(224, 82, 82, 0.5); }
  .hero h1 {
    font-size: clamp(23px, 3.4vw, 37px);
    line-height: 1.3;
    font-weight: 900;
    background: linear-gradient(90deg, #fff6df 0%, var(--gold-bright) 55%, var(--amber) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
  .hero-lead {
    color: #e2d8ca;
    font-size: 15px;
    margin-bottom: 0;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
    gap: 14px;
  }
  .kpi-card {
    background: rgba(13, 11, 9, 0.78);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .kpi-label { font-size: 11.5px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.03em; }
  .kpi-value { font-size: 20px; font-weight: 900; color: var(--gold-bright); margin: 2px 0; }
  .kpi-sub { font-size: 12px; color: var(--text-muted); }

  /* Section Headings */
  section {
    margin-bottom: 58px;
    scroll-margin-top: 78px;
  }
  .sec-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border-subtle);
    flex-wrap: wrap;
  }
  .sec-num {
    font-size: 13px;
    font-weight: 900;
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--gold-bright), var(--amber));
    padding: 3px 10px;
    border-radius: 6px;
    letter-spacing: 0.06em;
  }
  .sec-header h2 {
    font-size: clamp(20px, 2.5vw, 26px);
    font-weight: 800;
    color: var(--text-main);
  }
  h3 {
    font-size: 17.5px;
    font-weight: 800;
    color: var(--gold-bright);
    margin: 26px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h3::before {
    content: "";
    display: inline-block;
    width: 4px; height: 18px;
    background: linear-gradient(180deg, var(--gold-bright), var(--amber));
    border-radius: 2px;
    flex-shrink: 0;
  }
  p { margin-bottom: 12px; }

  /* Feature Art Banner */
  .art-banner {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 20px;
    background: linear-gradient(135deg, rgba(31, 25, 20, 0.96), rgba(20, 15, 11, 0.96));
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    overflow: hidden;
    margin: 18px 0 24px;
    box-shadow: var(--shadow);
  }
  @media (max-width: 820px) {
    .art-banner { grid-template-columns: 1fr; }
  }
  .art-banner-img {
    position: relative;
    cursor: pointer;
    overflow: hidden;
    min-height: 220px;
  }
  .art-banner-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
  }
  .art-banner-img:hover img { transform: scale(1.03); }
  .art-banner-badge {
    position: absolute;
    top: 10px; inset-inline-start: 10px;
    background: rgba(13, 11, 9, 0.84);
    color: var(--gold-bright);
    border: 1px solid var(--border-strong);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 800;
  }
  .art-banner-body {
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
  }
  .art-banner-body h4 {
    font-size: 17px;
    font-weight: 800;
    color: var(--gold-bright);
    line-height: 1.4;
  }
  .art-banner-body p {
    font-size: 13.8px;
    color: var(--text-muted);
    margin: 0;
  }
  .art-key-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
  }
  .art-key-list li {
    font-size: 13.3px;
    color: var(--text-main);
    padding-inline-start: 16px;
    position: relative;
  }
  .art-key-list li::before {
    content: "◆";
    position: absolute;
    inset-inline-start: 0;
    color: var(--amber);
    font-size: 10px;
    top: 3px;
  }

  /* Callouts & Trap Cards */
  .alert-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 14px;
    margin: 16px 0 24px;
  }
  .alert-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-inline-start: 4px solid var(--crimson);
    border-radius: var(--radius-sm);
    padding: 16px 18px;
  }
  .alert-card.is-tip { border-inline-start-color: var(--emerald); }
  .alert-card.is-gold { border-inline-start-color: var(--gold); }
  .alert-title {
    font-weight: 800;
    font-size: 15px;
    margin-bottom: 6px;
    color: #fff;
  }
  .alert-card.is-trap .alert-title { color: #ff9c9c; }
  .alert-card.is-tip .alert-title { color: #7ee3bc; }
  .alert-card.is-gold .alert-title { color: var(--gold-bright); }
  .alert-body { font-size: 13.8px; color: var(--text-muted); }

  /* Tables */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    background: var(--bg-card);
    margin: 14px 0 22px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.8px;
  }
  th, td {
    padding: 11px 14px;
    text-align: start;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }
  th {
    background: rgba(228, 182, 89, 0.12);
    color: var(--gold-bright);
    font-weight: 800;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(228, 182, 89, 0.04); }
  .num {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--gold-bright);
    direction: ltr;
    unicode-bidi: isolate;
  }
  .tag-warn {
    display: inline-block;
    background: rgba(224, 82, 82, 0.2);
    color: #ff9c9c;
    border: 1px solid rgba(224, 82, 82, 0.45);
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .tag-ok {
    display: inline-block;
    background: rgba(68, 185, 141, 0.18);
    color: #7ee3bc;
    border: 1px solid rgba(68, 185, 141, 0.45);
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 700;
  }
  .tag-info {
    display: inline-block;
    background: rgba(90, 169, 230, 0.18);
    color: #9dd1fa;
    border: 1px solid rgba(90, 169, 230, 0.45);
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 11.5px;
    font-weight: 700;
  }

  /* Infographic Shell */
  .info-box {
    background: linear-gradient(160deg, rgba(28, 22, 16, 0.96), rgba(18, 14, 11, 0.98));
    border: 1px solid var(--border-strong);
    border-radius: 16px;
    padding: 22px;
    margin: 18px 0 26px;
    box-shadow: var(--shadow);
  }
  .info-box-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .info-box-title {
    font-size: 16px;
    font-weight: 900;
    color: var(--gold-bright);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .info-tag {
    font-size: 11px;
    font-weight: 800;
    color: #161007;
    background: var(--gold);
    padding: 2px 9px;
    border-radius: 999px;
  }

  /* Infographic 1: 7-Day KvK Roadmap */
  .roadmap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .rm-day {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-top: 3px solid var(--gold);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .rm-day.is-warn { border-top-color: var(--crimson); }
  .rm-day.is-overlap { border-top-color: var(--emerald); }
  .rm-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 4px;
  }
  .rm-num { font-weight: 900; font-size: 13px; color: var(--gold-bright); }
  .rm-date { font-size: 11px; color: var(--text-dim); font-weight: 700; }
  .rm-theme { font-size: 13.5px; font-weight: 800; color: #fff; }
  .rm-do, .rm-save, .rm-sub {
    font-size: 11.8px;
    line-height: 1.45;
    padding: 5px 7px;
    border-radius: 6px;
  }
  .rm-do { background: rgba(68, 185, 141, 0.12); color: #b8f2da; border-inline-start: 2px solid var(--emerald); }
  .rm-save { background: rgba(224, 82, 82, 0.12); color: #ffc2c2; border-inline-start: 2px solid var(--crimson); }
  .rm-sub { background: rgba(228, 182, 89, 0.12); color: var(--gold-bright); border-inline-start: 2px solid var(--gold); }
  .rm-lbl { font-weight: 800; display: block; font-size: 10.5px; opacity: 0.9; margin-bottom: 1px; }

  /* Infographic 2: Cooking Bonus Bar Chart */
  .cook-compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 760px) {
    .cook-compare { grid-template-columns: 1fr; }
  }
  .cook-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 16px;
  }
  .cook-panel h4 {
    font-size: 14.5px;
    color: var(--gold-bright);
    margin-bottom: 12px;
  }
  .bar-row { margin-bottom: 12px; }
  .bar-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12.8px;
    margin-bottom: 5px;
    gap: 8px;
  }
  .bar-track {
    height: 22px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 999px;
    overflow: hidden;
    direction: ltr;
    unicode-bidi: isolate;
  }
  .bar-fill {
    height: 100%;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    font-size: 11.5px;
    font-weight: 900;
    color: #140e07;
  }
  .bar-gold { background: linear-gradient(90deg, var(--amber), var(--gold-bright)); }
  .bar-gray { background: linear-gradient(90deg, #6d6155, #9a8b7b); color: #fff; }
  .bar-red { background: linear-gradient(90deg, #b83a3a, #ef6b6b); color: #fff; }
  .bar-green { background: linear-gradient(90deg, #2b8a67, #56d6a6); color: #082016; }
  .cook-note {
    font-size: 12.6px;
    color: var(--text-muted);
    background: rgba(224, 82, 82, 0.12);
    border: 1px solid rgba(224, 82, 82, 0.35);
    border-radius: 8px;
    padding: 9px 12px;
    margin-top: 8px;
  }

  /* Infographic 3: 3-Step Alliance Shuffle Flow */
  .step-flow {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    gap: 12px;
    align-items: stretch;
  }
  .step-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-size: 24px;
    font-weight: 900;
  }
  html[dir="rtl"] .step-arrow {
    transform: scaleX(-1);
  }
  @media (max-width: 820px) {
    .step-flow { grid-template-columns: 1fr; }
    .step-arrow, html[dir="rtl"] .step-arrow { transform: rotate(90deg); justify-self: center; }
  }
  .step-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .step-card.is-result {
    border-color: rgba(68, 185, 141, 0.55);
    background: linear-gradient(155deg, rgba(24, 46, 37, 0.55), var(--bg-card));
  }
  .step-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 900;
    color: #140f08;
    background: var(--gold-bright);
    padding: 2px 9px;
    border-radius: 999px;
    width: fit-content;
  }
  .step-card.is-result .step-badge { background: var(--emerald); color: #051c13; }
  .step-title { font-size: 14.5px; font-weight: 800; color: #fff; }
  .step-desc { font-size: 13px; color: var(--text-muted); }

  /* Infographic 4: Gantt Timeline Calendar (LTR-preserved timeline axis) */
  .gantt-wrap {
    overflow-x: auto;
    direction: ltr;
    unicode-bidi: isolate;
  }
  .gantt-table {
    width: 100%;
    min-width: 680px;
    border-collapse: separate;
    border-spacing: 0 6px;
    font-size: 12.8px;
  }
  .gantt-table th {
    background: rgba(228, 182, 89, 0.14);
    text-align: center;
    padding: 8px 6px;
    font-size: 12px;
  }
  .gantt-table th:first-child { text-align: left; padding-left: 12px; border-radius: 8px 0 0 8px; }
  .gantt-table th:last-child { border-radius: 0 8px 8px 0; }
  .gantt-table td {
    background: var(--bg-card);
    padding: 9px 6px;
    text-align: center;
    border-bottom: none;
  }
  .gantt-table td:first-child {
    text-align: left;
    padding-left: 12px;
    font-weight: 800;
    color: #fff;
    border-radius: 8px 0 0 8px;
    white-space: nowrap;
  }
  .gantt-table td:last-child { border-radius: 0 8px 8px 0; }
  .g-bar {
    height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    padding: 0 6px;
    white-space: nowrap;
  }
  .g-gold { background: linear-gradient(90deg, rgba(228, 182, 89, 0.85), rgba(223, 122, 53, 0.85)); color: #161007; }
  .g-green { background: rgba(68, 185, 141, 0.85); color: #071f16; }
  .g-red { background: rgba(224, 82, 82, 0.9); color: #fff; }
  .g-sky { background: rgba(90, 169, 230, 0.85); color: #071929; }

ery single day."},{"title":"Trap 2: No Bonus Dishes on Day 7 of Feast Preparations","body":"Days 1–6 feature 2 daily bonus dishes (+25%, 40pt → 50pt), but <strong>Day 7 (Nov 30) has NO bonus dishes<\/strong>. Hoarding until the last day loses 20% value! Unused ingredients also downgrade into <strong>Lv.2 Resource Chests<\/strong> after the event."},{"title":"Trap 3: Pumpkin Smash Ends 1 Day Early (Nov 29)","body":"While main events and Lucky Cabin run through Nov 30, <strong>Pumpkin Smash runs Nov 25–29<\/strong> and closes a day earlier. Also, the Top 10 Alliance <strong>Harvest Festival banquet runs for 1 hour only on Dec 1<\/strong> and requires being online."},{"title":"Trap 4: Leaving Your Alliance Locks You Out of Points & Banquet","body":"Your alliance loyalty locks when the event begins. Switching alliances mid-event prevents your cooking points from counting for the new alliance and <strong>forfeits your Dec 1 Harvest Festival eligibility<\/strong>. Finish any alliance moves before launch."},{"title":"Top F2P Tip: +500 Free Points/Day via Alliance Ingredient Shuffle","body":"Trade surplus ingredients back and forth via Alliance Requests (50/day cap, 10pt per donation) to earn <strong>+500 points/day and 300pt milestone chests at zero net ingredient cost<\/strong>."}],"cards":[{"badge":"BS01 Live UI","title":"Patron of Plenty Main Screen (Nov 24–30, 2026 · Daily 09:00 JST Reset)","source":"Verified Live In-Game Screenshot (JP UI)","meta":"JP Live UI"},{"badge":"BS02 Live UI","title":"Patron of Plenty Official Rules & Mechanics","source":"Verified Live In-Game Screenshot (JP UI)","meta":"JP Live UI"}]},"sec2":{"title":"Patron of Plenty: All 7 Phases Verified Data & Strategy Tabs","lead":"All 7 phase scoring rules were verified directly on the live client. Switch tabs below to inspect exact point tables, live UI screenshots, and KvK-safe moves for each day. Click any image to zoom.","phases":[{"id":"day1","tabName":"Day 1 Power Up","tabDate":"Nov 24 (Tue)","ba ":"Day 6","date":"Nov 29 (Sun)","theme":"Gathering","doLbl":"Do","do":"Return overnight marches + normal troops + <strong>cook bonus dishes<\/strong>","saveLbl":"Save","save":"All speedups","subLbl":"Deadline!","sub":"<strong>Pumpkin Smash ends / Final Cooking Bonus day!<\/strong>"},{"cls":"is-overlap","num":"Day 7","date":"Nov 30 (Mon)","theme":"Governor Gear","doLbl":"Do","do":"Double-dip <strong>speedups & Gov Gear<\/strong> if KvK Day 1 overlaps","saveLbl":"Caution","save":"No cooking bonus (leftovers only)","subLbl":"Overlap / Note","sub":"Check KvK Day 1 overlap / Lucky Cabin ends"}],"tableHeaders":["Date","Phase","KvK-Safe Move (What to Do)","What to Save"],"tableRows":[["<strong>Nov 24 (Day 1)<\/strong>","Power Boost","Spend <strong>half<\/strong> of Recruitment Keys + routine builds/tech","Legendary Shards & heavy speedups"],["<strong>Nov 25 (Day 2)<\/strong>","Beast Slaying","Hunt beasts w/ stamina hero (<strong>clear Supplies 700 pouches<\/strong>)","Excess stamina cans"],["<strong>Nov 26 (Day 3)<\/strong>","Hero Dev","Spend <strong>remaining half<\/strong> of keys + minimal speedups","Legendary Shards & general speedups"],["<strong>Nov 27 (Day 4)<\/strong>","Troop Training","Claim pre-queued troops + regular training","Training speedups (save for KvK)"],["<strong>Nov 28 (Day 5)<\/strong>","Hero Gear","Batch <strong>routine Gem spending<\/strong> (VIP Shop) + needed Forgehammers","Excess Exclusive Gear Widgets"],["<strong>Nov 29 (Day 6)<\/strong>","Gathering","Return overnight marches + normal troops (<strong>*Pumpkin Smash ends<\/strong>)","All speedups"],["<strong>Nov 30 (Day 7)<\/strong>","Governor Gear","<strong>Double-dip speedups if KvK Prep Day 1 overlaps<\/strong> (check calendar)","*Verify kingdom Day 7 milestone cap"]]},"sec4":{"title":"Feast Preparations (Cooking), Supplies & Top F2P Trick","art1Badge":"Cooking Bonus Strategy · Zoom","art1Title":"Feast Preparations: Day 1–6 Bonus Dish Concentration","art1Source":"Guide Exclusive Visual","art1Alt":"Feast Preparations Cooking Bonus Visual","art1Heading":"1. Golden Cooking Rule: Cook Bonus Dishes Only on Days 1–6 (No Bonus on Day 7!)","art1Body":"Each dish uses 4 ingredients. Standard dishes give <strong>40 pt<\/strong>, while Days 1–6 designate 2 daily <strong>Bonus Dishes (+25%, 40 pt → 50 pt)<\/strong>. Because <strong>Day 7 (Nov 30) has NO bonus dishes<\/strong>, saving ingredients for the final day is a huge loss.","art1List":["Focus all main ingredients into the 2 daily bonus dishes during Days 1–6","Leftover ingredients and pouches convert into <strong>Lv.2 Resource Chests<\/strong> when the event ends","Finish your main cooking by Day 6 and only clear stray leftovers on Day 7"],"info2Title":"Diagram 2: Day 1–6 Bonus Dishes (+25%) vs. Day 7 No-Bonus Trap","info2Tag":"Efficiency & Ingredient Cost Comparison","p1Title":"Points Earned per Dish (4 Ingredients)","p1b1Label":"<strong>Days 1–6 Bonus Dishes (2/day)<\/strong>","p1b1Val":"50 pt (+25%)","p1b1Bar":"50 pt","p1b2Label":"Standard Dish / <strong>Day 7 (No Bonus)<\/strong>","p1b2Val":"40 pt (-20% loss)","p1b2Bar":"40 pt","p1Note":"<strong>Takeaway:<\/strong> Dumping everything on Day 7 forfeits +10 pt per dish and cuts your efficiency by <strong>20%<\/strong>. Always cook your main stock on bonus dishes by Day 6.","p2Title":"Ingredients Needed for Permanent City Skin (125,000 pt)","p2b1Label":"<strong>Bonus Dishes Only (2,500 dishes)<\/strong>","p2b1Val":"~10,000 items","p2b1Bar":"10,000","p2b2Label":"Standard Dishes Only (3,125 dishes)","p2b2Val":"~12,500 items (+2,500 wasted!)","p2b2Bar":"12,500","p2Note":"<strong>2,500 Ingredient Gap:<\/strong> Skipping bonus dishes wastes <strong>2,500 extra ingredients (625 dishes)<\/strong> to reach the exact same 125,000 pt skin milestone.","art2Badge":"Alliance Co-op & 1,000 Pouches · Zoom","art2Title":"Alliance Ingredient Shuffle & Supplies of Plenty","art2Source":"Guide Exclusive Visual","art2Alt":"Alliance Ingredient Request Cooperation Visual","art2Heading":"2. Supplies of Plenty: Claim All 1,000 Must-Have Pouches (300 Gathering + 700 Beasts)","art2Body":"Ingredient pouches drop from 4 Supplies of Plenty tracks (Gathering, Beasts, Gem Spend, Speedups). Even F2P players must max out <strong>Resource Gathering (300 pouches) + Beast Hunting (700 pouches) = 1,000 pouches<\/strong>.","art2List":["<strong>300 Gathering + 700 Beasts = 1,000 pouches<\/strong> align seamlessly with Day 2 Beasts & Day 6 Gathering","<strong>Swordland healing speedups count<\/strong> toward the speedup track—great bonus if Swordland overlaps","Claim the 10 free starter pouches and check daily drops without fail"],"sub3Heading":"3. Best F2P Trick: 'Alliance Ingredient Shuffle' for +500 Free Points/Day","info3Title":"Diagram 3: 3-Step 'Back-and-Forth Shuffle' (+500 pt/day & 300pt Chests at Zero Cost)","info3Tag":"F2P / Low-Spender Essential","steps":[{"badge":"STEP 1 · Request & Donate","title":"Pair Up & Request Surplus Ingredients","desc":"Pair up with an alliance mate (or coordinate in Alliance Chat) and request surplus ingredients you both already hold (e.g., 20 items)."},{"badge":"STEP 2 · Send & Return","title":"1 Donation = 10 pt (50/Day Cap)","desc":"Donate to your partner to earn <strong>+10 pt each<\/strong>. Then have them request the same ingredient back so you return what you received."},{"badge":"STEP 3 · Pure Net Gain","title":"+500 pt/Day & Free 300pt Chests!","desc":"Gain <strong>+500 points every day without losing a single ingredient<\/strong>, while unlocking <strong>300pt milestone chests (chances at 10k–30k Gems & Charm materials)<\/strong> for free!"}]},"sec5":{"title":"Sub-Event End-Date Mismatch & Dec 1 Harvest Festival Banquet","lead":"Not all Harvest Celebration sub-events share the same end date. <strong>Pumpkin Smash closes 1 day early<\/strong> and the <strong>Dec 1 Harvest Festival banquet lasts only 1 hour<\/strong>—review the timeline and summary table below.","info4Title":"Diagram 4: Sub-Event Deadline Mismatch Ca   function escAttr(str) {

  }

  function detectInitialLang() {
    try {
      const params = new URLSearchParams(window.location.search);
      const q = (params.get('lang') || '').toLowerCase();
      if (SUPPORTED_LANGS.includes(q)) return q;
    } catch (e) {}
    try {
      const saved = (localStorage.getItem(STORAGE_KEY) || '').toLowerCase();
      if (SUPPORTED_LANGS.includes(saved)) return saved;
    } catch (e) {}
    return 'ja';
  }

  function renderMediaCard(src, badge, title, source, meta, zoomHint) {
    return `
      <figure class="media-card fig-bs" data-lightbox="${escAttr(src)}" data-title="${escAttr(title)}" data-source="${escAttr(source)}">
        <div class="media-thumb">
          <img src="${escAttr(src)}" alt="${escAttr(title)}" loading="lazy">
          <span class="media-badge badge-bs">${badge}</span>
        </div>
        <figcaption>
          <div class="cap-title">${title}</div>
          <div class="cap-meta"><span>${meta}</span><span class="zoom-hint">${zoomHint}</span></div>
        </figcaption>
      </figure>
    `;
  }

        </div>

    `).join('');

        <td>${g.r3Name}</td>
        <td colspan="7"><div class="g-bar g-gold">${g.r3Bar}</div></td>
        <td><span class="g-dim">${g.ended}</span></td>
      </tr>
      <tr>
        <td>${g.r4Name}</td>
        <td><span class="g-dim">${g.before}</span></td>
        <td colspan="5"><div class="g-bar g-red">${g.r4Bar}</div></td>
        <td><span class="g-dim">${g.endedDone}</span></td>
        <td><span class="g-dim">${g.endedDone}</span></td>
      </tr>
      <tr>
        <td>${g.r5Name}</td>
        <td><span class="g-dim">${g.before}</span></td>
        <td colspan="6"><div class="g-bar g-sky">${g.r5Bar}</div></td>
        <td><span class="g-dim">${g.ended}</span></td>
      </tr>
      <tr>
        <td>${g.r6Name}</td>
        <td colspan="7"><span class="g-dim">${g.r6Span}</span></td>
        <td><div class="g-bar g-red">${g.r6Bar}</div></td>
      </tr>
    `;
    setArtCard('art3Card', 'art3Img', 'art3Badge', t.sec5.art3Title, t.sec5.art3Source, t.sec5.art3Alt, t.sec5.art3Badge);
    $('art3Heading').textContent = t.sec5.art3Heading;
    $('art3Body').innerHTML = t.sec5.art3Body;
    $('art3List').innerHTML = t.sec5.art3List.map(li => `<li>${li}</li>`).join('');
    $('subEventHead').innerHTML = t.sec5.tableHeaders.map(h => `<th>${h}</th>`).join('');
    $('subEventBody').innerHTML = t.sec5.tableRows.map(r =>
      `<tr><td>${r[0]}</td><td class="num ltr-keep">${r[1]}</td><td>${r[2]}</td></tr>`
    ).join('');

    // Section 6
    $('sec6Title').textContent = t.sec6.title;
    setArtCard('art4Card', 'art4Img', 'art4Badge', t.sec6.art4Title, t.sec6.art4Source, t.sec6.art4Alt, t.sec6.art4Badge);
    $('art4Heading').textContent = t.sec6.art4Heading;
    $('art4Body').innerHTML = t.sec6.art4Body;
    $('art4List').innerHTML = t.sec6.art4List.map(li => `<li>${li}</li>`).join('');
    $('sec6Sub2Heading').textContent = t.sec6.sub2Heading;
    $('skinHead').innerHTML = t.sec6.skinHeaders.map(h => `<th>${h}</th>`).join('');
    $('skinBody').innerHTML = t.sec6.skinRows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
    $('sec6Sub3Heading').textContent = t.sec6.sub3Heading;
    $('cautiousTitle').textContent = t.sec6.cautiousTitle;
    $('cautiousList').innerHTML = t.sec6.cautiousList.map(li => `<li>${li}</li>`).join('');
    $('activeTitle').textContent = t.sec6.activeTitle;
    $('activeList').innerHTML = t.sec6.activeList.map(li => `<li>${li}</li>`).join('');

    // Section 7
    $('sec7Title').textContent = t.sec7.title;
    $('sec7Lead').innerHTML = t.sec7.lead;
    const noteEl = $('uiLangNote');
    if (t.sec7.uiNote) {
      noteEl.textContent = t.sec7.uiNote;
      noteEl.classList.add('visible');
    } else {
      noteEl.textContent = '';
      noteEl.classList.remove('visible');
    }
    $('filterLabel').textContent = t.sec7.filterLabel;
    $('catBtnAll').textContent = t.sec7.cats.ALL;
    $('catBtnBasic').textContent = t.sec7.cats.basic;
    $('catBtnEarly').textContent = t.sec7.cats.early;
    $('catBtnLate').textContent = t.sec7.cats.late;
    $('archiveCountPrefix').textContent = t.sec7.countPrefix;
    $('archiveCountSuffix').textContent = t.sec7.countSuffix;
    renderGallery();

    // Footer & Lightbox
    $('footerLine1').textContent = t.footer.line1;
    $('footerLine2').textContent = t.footer.line2;
    $('lbClose').textContent = t.lightbox.close;
    $('lbPrev').setAttribute('aria-label', t.lightbox.prevAria);
    $('lbNext').setAttribute('aria-label', t.lightbox.nextAria);
    $('lbHint').textContent = t.lightbox.hint;
  }

  // Language switcher click events
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      applyLanguage(btn.getAttribute('data-lang'), true);
    });
  });

  // Gallery category filters
  document.querySelectorAll('#catFilters .filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#catFilters .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      curCat = btn.getAttribute('data-cat');
      renderGallery();
    });
  });

  // Universal Lightbox
  const lb = $('lightbox');
  const lbImg = $('lbImg');
  const lbTitle = $('lbTitle');
  const lbSource = $('lbSource');
  const lbClose = $('lbClose');
  const lbPrev = $('lbPrev');
  const lbNext = $('lbNext');

  let lbList = [];
  let lbIdx = 0;

  function showLightboxItem(idx) {
    if (!lbList.length) return;
    lbIdx = (idx + lbList.length) % lbList.length;
    const el = lbList[lbIdx];
    lbImg.src = el.getAttribute('data-lightbox');
    lbTitle.textContent = el.getAttribute('data-title') || '';
    lbSource.textContent = (el.getAttribute('data-source') || '') + ` (${lbIdx + 1} / ${lbList.length})`;
  }

  document.addEventListener('click', e => {
    const card = e.target.closest('[data-lightbox]');
    if (!card) return;
    const parentGrid = card.closest('.media-grid, .archive-grid') || document;
    lbList = Array.from(parentGrid.querySelectorAll('[data-lightbox]'));
    const idx = lbList.indexOf(card);
    showLightboxItem(idx >= 0 ? idx : 0);
    lb.classList.add('open');
  });

  function closeLb() { lb.classList.remove('open'); }
  lbClose.addEventListener('click', closeLb);
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  lbPrev.addEventListener('click', () => showLightboxItem(lbIdx - 1));
  lbNext.addEventListener('click', () => showLightboxItem(lbIdx + 1));
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') showLightboxItem(lbIdx - 1);
    if (e.key === 'ArrowRight') showLightboxItem(lbIdx + 1);
  });

  // Init
  applyLanguage(detectInitialLang(), false);
})();
</script>
</body>
</html>
